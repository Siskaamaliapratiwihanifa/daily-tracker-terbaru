const GOALS=[{t:'Python dasar & Pandas lancar',d:'2027-01-31',p:0},{t:'Persiapan TOEFL untuk LPDP',d:'2028-02-29',p:0},{t:'Persiapan CPNS 2026 & 2027',d:'2027-12-31',p:0},{t:'Proposal tesis disetujui',d:'2027-11-30',p:0},{t:'Lulus Magister Informatika Unhas',d:'2028-04-30',p:0}];
function phase(k){if(k<'2027-02')return'Persiapan Awal';if(k<'2027-07')return'Semester 1';if(k<'2027-12')return'Semester 2';return'Semester 3'}

const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const wita=()=>new Date(Date.now()+8*36e5),ymd=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const today=()=>ymd(wita()),dt=s=>new Date(s+'T00:00:00Z');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={},PRA=null,cur=today(),sel=cur,cy=+cur.slice(0,4),cmo=+cur.slice(5,7)-1,qo=0;
function init(o){S=o||{};S.d=S.d||{};S.ev=S.ev||{};S.m=S.m||{};if(!S.goals)S.goals=JSON.parse(JSON.stringify(GOALS));
  S.set=Object.assign({},DEF,S.set||{});S.set.pr=Object.assign({},DEF.pr,S.set.pr);S.set.off=S.set.off||{};S.set.times=S.set.times||{}}
try{init(JSON.parse(localStorage.getItem('dt2')||'null'))}catch(e){init()}
const save=()=>{try{localStorage.setItem('dt2',JSON.stringify(S))}catch(e){}};
function applyTheme(){const a=ACC[S.set.accent]||ACC.pink,r=document.documentElement;['--pk','--pk2','--pe','--lv'].forEach((v,i)=>r.style.setProperty(v,a[i]));r.dataset.t=S.set.mode;$('tc').content=a[0]}
function toast(t){const e=$('ts');e.textContent=t;e.classList.add('on');clearTimeout(toast.x);toast.x=setTimeout(()=>e.classList.remove('on'),1600)}

const pr=k=>(S.set.auto&&PRA&&PRA[k])||S.set.pr[k];
const tmOf=e=>e[1].startsWith('P:')?pr(e[1].slice(2)):(S.set.times[e[0]]||e[1]);
function items(s){const w=dt(s).getUTCDay(),f=MF[s.slice(0,7)]||'Ikuti roadmap';
  return CAT.filter(e=>(!e[6]||e[6].includes(w))&&!S.set.off[e[0]]).map(e=>({id:e[0],t:tmOf(e),ic:e[2],g:e[3],n:e[4](w),sub:e[5]?e[5](w,f):''})).sort((a,b)=>a.t<b.t?-1:a.t>b.t?1:0)}
function pct(s){const it=items(s),c=S.d[s]||{};return it.length?Math.round(it.filter(i=>c[i.id]).length/it.length*100):0}
function streak(){let n=0,d=dt(today());if(pct(ymd(d))<70)d.setUTCDate(d.getUTCDate()-1);while(pct(ymd(d))>=70&&n<999){n++;d.setUTCDate(d.getUTCDate()-1)}return n}
const qs=()=>S.set.quotes?QS.concat(S.set.custom.split('\n').map(x=>x.trim()).filter(Boolean)):[];

function rToday(){
  const k=cur.slice(0,7),it=items(cur),c=S.d[cur]||{},d=dt(cur),w=d.getUTCDay(),hr=wita().getUTCHours();
  $('gr').textContent=(hr<11?'Selamat pagi':hr<15?'Selamat siang':hr<18?'Selamat sore':'Selamat malam')+', '+S.set.name+' 🌸';
  $('hd').textContent=DAYS[w]+(cur==today()?' · Hari ini':'');
  $('sd').textContent=d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+d.getUTCFullYear()+' · WITA';
  $('ph').textContent='📍 '+phase(k);$('fk').textContent='🎯 '+(MF[k]||'Roadmap');$('st').textContent='🔥 '+streak()+' hari';
  const p=pct(cur);$('rg').style.setProperty('--p',p);$('pc').textContent=p+'%';
  const nt=pad(wita().getUTCHours())+':'+pad(wita().getUTCMinutes());let cp=null;if(cur==today())for(const i of it)if(i.t<=nt)cp=i.id;
  const dn=it.filter(i=>c[i.id]).length,nx=it.find(i=>!c[i.id]&&(cur!=today()||i.t>=nt))||it.find(i=>!c[i.id]);
  const GE={Ibadah:'🕌 Ibadah',Pagi:'🌅 Pagi',Belajar:'📚 Belajar',Sore:'🌇 Sore',Malam:'🌙 Malam'};
  let h='<div class="stats"><div class="tile a"><em>✅</em><b>'+dn+'/'+it.length+'</b><span>selesai</span></div><div class="tile b"><em>🔥</em><b>'+streak()+'</b><span>hari streak</span></div><div class="tile c"><em>⭐</em><b>'+p+'%</b><span>progres</span></div></div>';
  if(it.length)h+=nx?'<div class="nx" onclick="tg(\''+nx.id+'\')"><div class="ic big">'+nx.ic+'</div><div><small>BERIKUTNYA · '+nx.t+'</small><b>'+nx.n+'</b></div><div class="go">✓</div></div>':'<div class="nx all"><div class="ic big">🏆</div><div><small>LUAR BIASA</small><b>Semua kegiatan hari ini selesai!</b></div></div>';
  const Q=qs();if(Q.length)h+='<div class="q" onclick="qo++;rToday()"><span>”</span><small>✨ SEMANGAT HARI INI</small><p>'+esc(Q[(Math.floor(dt(cur)/864e5)+qo)%Q.length])+'</p></div>';
  const ev=S.ev[cur]||[];if(ev.length)h+='<div class="g">📌 Agenda</div>'+ev.map(e=>'<div class="card">'+esc(e)+'</div>').join('');
  if(!it.length)h+='<div class="card nt">Semua kegiatan dinonaktifkan. Aktifkan lagi di tab Setelan.</div>';
  let lg='';
  for(const i of it){if(i.g!=lg){h+='<div class="g">'+GE[i.g]+'</div>';lg=i.g}
    h+='<div class="card it G-'+i.g+(c[i.id]?' done':'')+(i.id==cp?' now':'')+'" onclick="tg(\''+i.id+'\')"><div class="ic">'+i.ic+'</div><div class="n">'+i.n+(i.id==cp?'<span class="tag">sekarang</span>':'')+(i.sub?'<small>'+i.sub+'</small>':'')+'</div><div class="t">'+i.t+'</div><div class="ck">'+(c[i.id]?'✓':'')+'</div></div>'}
  $('v0').innerHTML=h;
}
function rCal(){
  const first=new Date(Date.UTC(cy,cmo,1)).getUTCDay(),n=new Date(Date.UTC(cy,cmo+1,0)).getUTCDate(),td=today();
  let h='<div class="card"><div class="row" style="margin-bottom:10px"><button class="sm" onclick="cm(-1)">‹</button><b>'+MON[cmo]+' '+cy+'</b><button class="sm" onclick="cm(1)">›</button></div><div class="cal">'+DAYS.map(x=>'<div class="h">'+x.slice(0,3)+'</div>').join('')+'<div></div>'.repeat(first);
  for(let i=1;i<=n;i++){const s=cy+'-'+pad(cmo+1)+'-'+pad(i),p=s<=td?pct(s):0;
    h+='<div class="cd'+(s==td?' td':'')+(s==sel?' sl':'')+'" onclick="sel=\''+s+'\';rCal()">'+i+'<i class="'+(p>=70?'b':p>0?'a':'')+'"></i>'+((S.ev[s]||[]).length?'<em></em>':'')+'</div>'}
  h+='</div><p class="nt" style="margin:12px 2px 0">🟢 ≥70% selesai · 🌸 ada centang · 🟣 ada agenda</p></div>';
  const ev=S.ev[sel]||[],d=dt(sel);
  h+='<div class="g">'+DAYS[d.getUTCDay()]+', '+d.getUTCDate()+' '+MON[d.getUTCMonth()]+'</div><div class="card"><div class="row"><span>Progres: <b>'+(sel<=td?pct(sel):0)+'%</b></span><button class="sm" onclick="cur=sel;render();tab(0)">Buka checklist</button></div>'
   +ev.map((e,i)=>'<div class="row" style="margin-top:10px"><span>📌 '+esc(e)+'</span><button class="sm" onclick="de(\''+sel+'\','+i+')">✕</button></div>').join('')+'<button class="big" onclick="ae()">+ Tambah agenda</button></div>';
  $('v1').innerHTML=h;
}
function rGoals(){
  const td=dt(today()),ym=today().slice(0,7);let h='<div class="g">Goals saya</div>';
  S.goals.forEach((g,i)=>{const ok=g.p>=100,left=g.d&&/^\d{4}-\d\d-\d\d$/.test(g.d)?Math.ceil((dt(g.d)-td)/864e5):null;
    h+='<div class="card gl"><div class="row"><h3>'+(ok?'🏆 ':'🎯 ')+esc(g.t)+'</h3><button class="sm" onclick="dg('+i+')">✕</button></div><div class="nt">'+(g.d?'Target: '+esc(g.d)+(left!==null?' · '+(left>=0?left+' hari lagi':'terlewat'):''):'Tanpa tenggat')+'</div><div class="pb'+(ok?' ok':'')+'"><i style="width:'+g.p+'%"></i></div><div class="row"><b>'+g.p+'%</b><span><button class="sm" onclick="gp('+i+',-10)">−10</button> <button class="sm" onclick="gp('+i+',10)">+10</button></span></div></div>'});
  h+='<button class="big" onclick="ag()">+ Tambah goal</button><div class="g">🗺️ Roadmap Nov 2026 – Apr 2028</div>';
  Object.keys(MF).forEach(m=>{const[y,mm]=m.split('-');h+='<div class="card mo'+(m==ym?' cur':'')+'"><b>'+MON[mm-1].slice(0,3)+' '+y.slice(2)+'</b><div><span style="color:var(--pk);font-weight:700">'+phase(m)+'</span><br>'+MF[m]+'</div></div>'});
  h+='<div class="g">Checklist evaluasi bulan ini</div>';const mc=S.m[ym]||{};
  MCHK.forEach((t,i)=>{h+='<div class="card it G-Belajar'+(mc[i]?' done':'')+'" onclick="tm('+i+')"><div class="n">'+t+'</div><div class="ck">'+(mc[i]?'✓':'')+'</div></div>'});
  $('v2').innerHTML=h;
}
function rProg(){
  let b='',tot=0;for(let n=6;n>=0;n--){const x=dt(today());x.setUTCDate(x.getUTCDate()-n);const s=ymd(x),q=pct(s);tot+=q;b+='<div class="bar"><i style="height:'+q*.85+'px"></i>'+q+'%<br>'+DAYS[x.getUTCDay()].slice(0,3)+'</div>'}
  const done={};Object.keys(S.d).forEach(s=>Object.keys(S.d[s]).forEach(i=>{if(S.d[s][i])done[i]=(done[i]||0)+1}));
  const L={tahajud:'🌙 Tahajud',subuh:'🕌 Subuh',dzuhur:'🕌 Dzuhur',ashar:'🕌 Ashar',maghrib:'🕌 Maghrib',isya:'🕌 Isya',main:'💻 Belajar sesi 1',main2:'🧠 Belajar sesi 2',toefl:'📘 TOEFL',cpns:'📝 CPNS',skin:'🧴 Skincare'};
  $('v3').innerHTML='<div class="g">7 hari terakhir</div><div class="card"><div class="bars">'+b+'</div><p class="nt" style="margin:12px 0 0">Rata-rata <b style="color:var(--tx)">'+Math.round(tot/7)+'%</b> · Streak <b style="color:var(--tx)">'+streak()+' hari</b></p></div><div class="g">Total hari tercentang</div><div class="card">'+Object.keys(L).map(i=>'<div class="mo" style="margin:4px 0"><b style="min-width:130px">'+L[i]+'</b><div>'+(done[i]||0)+' hari</div></div>').join('')+'</div>';
}
const sw=(on,fn)=>'<label class="sw"><input type="checkbox"'+(on?' checked':'')+' onchange="'+fn+'"><i></i></label>';
function rSet(){
  const s=S.set;let h='<div class="g">⚙️ Pengaturan</div>';
  h+='<div class="card"><div class="sh">👤 Profil</div><input class="inp" value="'+esc(s.name)+'" placeholder="Namamu" onchange="sv(\'name\',this.value.trim()||\'Amalia\')"></div>';
  h+='<div class="card"><div class="sh">🎨 Tampilan</div><div class="seg">'+[['auto','Otomatis'],['light','Terang'],['dark','Gelap']].map(x=>'<button class="'+(s.mode==x[0]?'on':'')+'" onclick="sv(\'mode\',\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div><div class="sws">'+Object.keys(ACC).map(k=>'<button class="swc'+(s.accent==k?' on':'')+'" title="'+ACC[k][4]+'" style="background:linear-gradient(135deg,'+ACC[k][0]+','+ACC[k][2]+')" onclick="sv(\'accent\',\''+k+'\')"></button>').join('')+'</div></div>';
  h+='<div class="card"><div class="sh">🕌 Jadwal sholat</div><div class="sr"><span>Ambil otomatis dari internet<br><small>Sumber: Kemenag RI via Aladhan</small></span>'+sw(s.auto,'sv(\'auto\',this.checked);if(this.checked)loadPrayer(1)')+'</div><input class="inp" value="'+esc(s.city)+'" placeholder="Kota (mis. Kendari)" onchange="sv(\'city\',this.value.trim()||\'Kendari\');PRA=null;loadPrayer(1)"><p class="nt">Jam di bawah dipakai kalau otomatis dimatikan atau sedang offline.</p>'
   +Object.keys(PL).map(k=>'<div class="sr"><span>'+PL[k]+'</span><input type="time" class="inp tm" value="'+s.pr[k]+'" onchange="sp(\''+k+'\',this.value)"></div>').join('')+'</div>';
  h+='<div class="card"><div class="sh">⏰ Jadwal harian</div><p class="nt" style="margin-top:0">Ubah jam atau matikan kegiatan yang tidak dipakai. Jam sholat mengikuti pengaturan di atas.</p>'
   +CAT.map(e=>{const p=e[1].startsWith('P:'),id=e[0];return '<div class="sr"><span class="mi">'+e[2]+'</span><span style="flex:1;font-size:13px;font-weight:600">'+(LBL[id]||e[4](1))+'</span>'+(p?'<span class="nt">'+tmOf(e)+'</span>':'<input type="time" class="inp tm" value="'+tmOf(e)+'" onchange="st(\''+id+'\',this.value)">')+sw(!s.off[id],'so(\''+id+'\',!this.checked)')+'</div>'}).join('')
   +'<button class="big gh" onclick="rs()">Kembalikan jadwal bawaan</button></div>';
  h+='<div class="card"><div class="sh">🔔 Pengingat</div><div class="sr"><span>Notifikasi saat waktunya tiba</span>'+sw(s.notif,'tn(this.checked)')+'</div><p class="nt">Berfungsi selama aplikasi masih terbuka atau berjalan di latar belakang. Kalau aplikasi sudah ditutup sepenuhnya, pengingat tidak bunyi.</p></div>';
  h+='<div class="card"><div class="sh">💬 Kata motivasi</div><div class="sr"><span>Tampilkan di Hari Ini</span>'+sw(s.quotes,'sv(\'quotes\',this.checked)')+'</div><p class="nt">Tambah kalimat sendiri (satu baris satu kalimat):</p><textarea class="inp" onchange="sv(\'custom\',this.value)">'+esc(s.custom)+'</textarea></div>';
  h+='<div class="card"><div class="sh">💾 Data</div><p class="nt" style="margin-top:0">Data tersimpan di browser HP ini. Buat cadangan secara berkala.</p><button class="big" onclick="dl()">Unduh cadangan (.json)</button><button class="big gh" onclick="$(\'fi\').click()">Pulihkan dari file cadangan</button><button class="big gh" onclick="cp()">Salin data ke clipboard</button><button class="big rd" onclick="rst()">Hapus semua data</button></div>';
  h+='<p class="nt" style="text-align:center">Daily Tracker · v2</p>';
  $('v4').innerHTML=h;
}
function render(){rToday();rCal();rGoals();rProg();rSet()}
function sv(k,v){S.set[k]=v;save();applyTheme();render()}
function sp(k,v){if(v){S.set.pr[k]=v;save();render()}}
function st(id,v){if(v){S.set.times[id]=v;save();render()}}
function so(id,off){if(off)S.set.off[id]=1;else delete S.set.off[id];save();render()}
function rs(){if(confirm('Kembalikan semua jam dan kegiatan ke jadwal bawaan?')){S.set.times={};S.set.off={};save();render()}}
function tn(on){if(!on){sv('notif',false);return}if(!('Notification' in window)){alert('Browser ini tidak mendukung notifikasi.');render();return}
  Notification.requestPermission().then(p=>{S.set.notif=p=='granted';save();if(p!='granted')alert('Izin notifikasi ditolak. Aktifkan lewat pengaturan situs atau aplikasi di HP.');render()})}
function tg(id){const c=S.d[cur]=S.d[cur]||{};c[id]=!c[id];save();render();if(c[id]){if(pct(cur)==100){toast('Semua selesai hari ini! 🏆');boom()}else toast(PRAISE[Math.floor(Math.random()*PRAISE.length)])}}
function boom(){const cl=['#ff4d94','#ffa77a','#8b7bff','#27c9a0','#ffd166','#ff8fb8'];for(let i=0;i<46;i++){const e=document.createElement('div');e.className='cf';e.style.left=Math.random()*100+'vw';e.style.background=cl[i%6];e.style.setProperty('--dx',(Math.random()*160-80)+'px');e.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
function tm(i){const k=today().slice(0,7);(S.m[k]=S.m[k]||{})[i]=!S.m[k][i];save();render()}
function mv(n){const d=dt(cur);d.setUTCDate(d.getUTCDate()+n);cur=ymd(d);render()}
function cm(n){cmo+=n;if(cmo<0){cmo=11;cy--}if(cmo>11){cmo=0;cy++}rCal()}
function ae(){const t=prompt('Agenda untuk '+sel+':');if(t&&t.trim()){(S.ev[sel]=S.ev[sel]||[]).push(t.trim());save();render()}}
function de(s,i){S.ev[s].splice(i,1);if(!S.ev[s].length)delete S.ev[s];save();render()}
function ag(){const t=prompt('Nama goal:');if(!t||!t.trim())return;const d=prompt('Tenggat (YYYY-MM-DD, boleh kosong):')||'';S.goals.push({t:t.trim(),d:d.trim(),p:0});save();render()}
function gp(i,n){const g=S.goals[i];g.p=Math.max(0,Math.min(100,g.p+n));save();render();if(g.p==100)toast('Goal tercapai! 🎉')}
function dg(i){if(confirm('Hapus goal ini?')){S.goals.splice(i,1);save();render()}}
function anim(){const m=document.querySelector('main');m.classList.add('an');setTimeout(()=>m.classList.remove('an'),900)}
function tab(n){for(let i=0;i<5;i++)$('v'+i).classList.toggle('hide',i!=n);document.querySelectorAll('nav.tabs button').forEach((b,i)=>b.classList.toggle('on',i==n));scrollTo(0,0);anim()}
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='daily-tracker-cadangan-'+today()+'.json';a.click();toast('Cadangan diunduh')}
function cp(){const t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Data disalin')).catch(()=>prompt('Salin data ini:',t))}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||typeof o!='object'||!o.d)throw 0;if(!confirm('Ganti semua data sekarang dengan isi file cadangan?'))return;init(o);save();applyTheme();render();toast('Data dipulihkan ✅')}catch(e){alert('File cadangan tidak valid.')}el.value=''};r.readAsText(f)}
function rst(){if(confirm('Hapus SEMUA data dan pengaturan? Ini tidak bisa dibatalkan.')&&confirm('Yakin? Pastikan sudah punya cadangan.')){try{localStorage.removeItem('dt2')}catch(e){}location.reload()}}
async function loadPrayer(force){
  if(!S.set.auto)return;const k='pr2'+today()+S.set.city;
  try{const c=localStorage.getItem(k);if(c&&!force){PRA=JSON.parse(c);render();return}}catch(e){}
  try{const r=await fetch('https://api.aladhan.com/v1/timingsByCity?city='+encodeURIComponent(S.set.city)+'&country=Indonesia&method=20'),t=(await r.json()).data.timings,f=x=>x.slice(0,5);
    PRA={subuh:f(t.Fajr),dzuhur:f(t.Dhuhr),ashar:f(t.Asr),maghrib:f(t.Maghrib),isya:f(t.Isha)};
    try{localStorage.setItem(k,JSON.stringify(PRA))}catch(e){}render();if(force)toast('Jadwal sholat diperbarui')}catch(e){if(force)toast('Gagal mengambil jadwal, pakai jam manual')}
}
const fired={};
function remind(){if(!S.set.notif||!('Notification' in window)||Notification.permission!='granted')return;
  const nt=pad(wita().getUTCHours())+':'+pad(wita().getUTCMinutes()),c=S.d[today()]||{};
  items(today()).forEach(i=>{const k=today()+i.id;if(i.t==nt&&!c[i.id]&&!fired[k]){fired[k]=1;const o={body:i.n,icon:'icon-192.png',tag:k};
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(i.ic+' '+i.t,o)).catch(()=>new Notification(i.ic+' '+i.t,o));else new Notification(i.ic+' '+i.t,o)}})}
applyTheme();render();anim();loadPrayer();setInterval(()=>{rToday();remind()},20000);
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
